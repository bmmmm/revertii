# A native systemd unit running a script from a git checkout — no container.
# Copy to /etc/revertii/agent-bridge.conf and chmod 600.
#
# The commit is the state here, which makes snapshot and restore unusually
# clean: git already stores every previous version, so RESTORE does not depend
# on a registry still holding the old artefact.

KIND=daemon

SNAPSHOT='git -C /srv/agent-bridge rev-parse HEAD'

# $REVERTII_SYSTEMD_SCOPE resolves to --system when revertii runs as root and
# --user when it does not, so this file does not have to pick one. A bare
# `systemctl` always reaches the system manager, which is right here and wrong
# for the rootless case — and it fails inside RESTORE, where a failure means
# the checkout moved back but the service kept running the broken version.
UPDATE='git -C /srv/agent-bridge pull --ff-only && systemctl $REVERTII_SYSTEMD_SCOPE restart agent-bridge.service'

# --detach avoids leaving the checkout on a branch that the next pull would
# fast-forward straight back into the broken state.
RESTORE='git -C /srv/agent-bridge checkout --detach "$REVERTII_SNAPSHOT" && systemctl $REVERTII_SYSTEMD_SCOPE restart agent-bridge.service'

# systemd's own view is not enough on its own: a unit can be "active" while the
# process inside it is wedged, which is the "hängt aus nem anderen grund" case.
# Pair the unit check with something the service has to actually answer.
HEALTH='systemctl $REVERTII_SYSTEMD_SCOPE is-active --quiet agent-bridge.service && curl -fsS --max-time 5 http://127.0.0.1:9000/healthz'

HEALTH_TIMEOUT=60
HEALTH_INTERVAL=3
REVERT_AFTER=240
