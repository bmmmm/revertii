# A containerised daemon whose image tag is pinned in an .env file.
# Copy to /etc/revertii/gateway.conf and chmod 600 — this file is sourced.
#
# Single quotes throughout. The file is sourced, so a double-quoted
# $REVERTII_SNAPSHOT would expand to nothing right here instead of at revert
# time, leaving a RESTORE that quietly restores whatever is already running.

KIND=daemon

# Anything that prints the current state on stdout. Pinning the tag in .env
# rather than reading it back off the container keeps snapshot and restore
# symmetrical — you write back exactly what you read.
SNAPSHOT='sed -n "s/^GATEWAY_TAG=//p" /srv/gateway/.env'

UPDATE='cd /srv/gateway && docker compose pull && docker compose up -d'

# $REVERTII_SNAPSHOT is passed in the environment, never spliced into this
# string — a tag containing a slash or a space cannot change what runs.
# Rewriting through a temp file rather than sed -i, because a tag with a slash
# in it would break a sed substitution.
RESTORE='cd /srv/gateway && grep -v "^GATEWAY_TAG=" .env > .env.new && printf "GATEWAY_TAG=%s\n" "$REVERTII_SNAPSHOT" >> .env.new && mv .env.new .env && docker compose up -d'

# Health means "answers", not "the process exists". A container can be up with
# the application inside it dead, which is exactly the case worth catching.
HEALTH='curl -fsS --max-time 5 http://127.0.0.1:8080/healthz'

HEALTH_TIMEOUT=90     # how long to keep retrying before calling it failed
HEALTH_INTERVAL=3     # seconds between attempts
REVERT_AFTER=300      # the dead man's switch; must exceed HEALTH_TIMEOUT
