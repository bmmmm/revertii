# A podman container from an image you build yourself, because no ready-made
# one exists — the npm/pip case. Copy to /etc/revertii/<name>.conf, chmod 600.
#
# Two things differ from an image you pull, and both matter.
#
# 1. The build goes in PREPARE, not UPDATE. It can take minutes, and anything
#    that runs inside the armed window risks outliving the timer: it would fire
#    mid-build, restore the old state, and then the finished build would switch
#    to the new version on top of the revert — live, unverified, with nothing
#    armed behind it. PREPARE runs before the timer is armed, because building
#    an image does not touch the running service.
#
# 2. The snapshot is the image ID, not the tag. A rebuild moves the tag, so a
#    tag recorded before the build points at the new image afterwards — and
#    "restoring" it would restore exactly what you were trying to undo. The ID
#    is stable, and the old image stays in local storage, which makes rollback
#    for a self-built image *easier* than for a pulled one: nothing has to be
#    fetched back from a registry.

KIND=daemon

# Build the candidate. Nothing here touches what is currently running.
PREPARE='podman build -t myapp:candidate /srv/myapp'

# The image the running container was started from — an ID, not a tag.
SNAPSHOT='podman inspect --format "{{.Image}}" myapp'

# Point the tag at the freshly built image, then restart the unit that runs it.
# Keep this fast: it is the only part inside the armed window.
UPDATE='podman tag myapp:candidate myapp:current && systemctl restart myapp.service'

# Retag back to the previous image ID and restart. The ID arrives through the
# environment, never spliced into this string.
RESTORE='podman tag "$REVERTII_SNAPSHOT" myapp:current && systemctl restart myapp.service'

# Ask the application, not the container runtime: podman will happily report a
# container as running while the process inside it is wedged.
HEALTH='curl -fsS --max-time 5 http://127.0.0.1:3000/healthz'

HEALTH_TIMEOUT=60
HEALTH_INTERVAL=3

# Only has to cover UPDATE plus the health check now that the build moved out.
REVERT_AFTER=180
