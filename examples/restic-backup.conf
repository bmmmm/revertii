# A periodic job — here restic, running in a container against host volumes.
# Copy to /etc/revertii/restic-backup.conf and chmod 600.
#
# The difference from a daemon is not cosmetic. Between two runs, "not
# running" is the healthy state, so there is nothing to probe. The signal is
# the last result and how old it is — and since a fresh update may not have
# run yet, the job is started once on purpose to find out.
#
# This is the failure this whole class exists for: a backup job broken by an
# update stays quiet until the day someone needs the backup.

KIND=job

UNIT=restic-backup.service

SNAPSHOT='sed -n "s/^RESTIC_TAG=//p" /srv/backup/.env'

UPDATE='cd /srv/backup && docker compose pull && docker compose up -d'

RESTORE='cd /srv/backup && grep -v "^RESTIC_TAG=" .env > .env.new && printf "RESTIC_TAG=%s\n" "$REVERTII_SNAPSHOT" >> .env.new && mv .env.new .env && docker compose up -d'

# Run the job once after updating and wait for its result. Set to no only if a
# probe run is genuinely expensive — but then the update goes unverified until
# the next scheduled run, and a revert at that point is no longer automatic.
PROBE_RUN=yes

# A backup run can take a while; this is the ceiling for the probe run.
HEALTH_TIMEOUT=1800
HEALTH_INTERVAL=10

# Generous, because the probe run itself has to fit inside it.
REVERT_AFTER=2400

# If no probe run happened, how old the last success may be before the job
# counts as unhealthy. Slightly over a day for a nightly backup.
MAX_AGE=100000
