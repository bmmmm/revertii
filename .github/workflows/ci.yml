# shellcheck over every shell file, bats over the test suite.
#
# Actions are pinned to commit SHAs, not tags: a tag is a movable pointer, and
# these run with the repo checked out. The version each SHA belongs to is in
# the trailing comment so Dependabot can bump both together.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: .
          # SC1091 ("not following: ./.env") is unavoidable here: the identity
          # helper sources a file that exists on a workstation and never in CI.
          # Everything at warning and above still fails the job.
          severity: warning

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y bats
      - name: Run bats tests
        run: bats test/

  # The stubbed suite above can only assert what revertii asks systemd to do.
  # This one runs against the runner VM's own systemd, which is the only thing
  # that can answer whether a transient timer is accepted and whether it fires.
  systemd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y bats
      - name: Start a user manager for this session
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Wait for the user manager to be up
        run: |
          for _ in $(seq 1 20); do
            systemctl --user show-environment >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "no systemd --user manager came up" >&2
          systemctl --user status >&2 || true
          exit 1
      - name: Run the real-systemd tests
        run: bats test/systemd.bats
      - name: Fail if they skipped instead of running
        # A skip here would read as a pass and leave the claim untested — the
        # exact failure mode this job exists to close.
        run: |
          out=$(bats test/systemd.bats)
          echo "$out"
          if grep -q '# skip' <<<"$out"; then
            echo "::error::real-systemd tests skipped in CI; they must run here" >&2
            exit 1
          fi
